<!doctype html>

    <meta charset="UTF-8" />

    <title>Tinhinane Belarbi — Personal Portfolio</title>

    <!-- Applique le thème sombre avant l'affichage pour éviter un flash blanc -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (!t && window.matchMedia("(prefers-color-scheme: dark)").matches) t = "dark";
          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

  </body>
